[package]
name = "sigiled-supervisor"
version = "0.1.0"
edition = "2021"
description = "SIGILED's resurrection, as a service — one duty, one file (DEC-01)"

# Stesso stack del control plane (sigiled DEC-16/06): axum+tokio+serde_json.
# Nessuna altra dipendenza: il percorso di resurrezione resta piccolo.
[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
